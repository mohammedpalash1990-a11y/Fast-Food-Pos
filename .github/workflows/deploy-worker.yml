name: Deploy POS to Cloudflare Workers

on:
  push:
    branches: [build/premium-pos-phase-1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-food-pos-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build frontend and API
        run: npm run build

      - name: Deploy Worker and static assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '3ae4916e5fc7b1d721e821158d03b900' }}
          command: deploy --config wrangler.jsonc
