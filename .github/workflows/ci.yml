name: POS build

on:
  push:
    branches: [build/premium-pos-phase-1]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check frontend, API, and build production assets
        run: npm run build
      - name: Run payroll and HR unit tests
        run: npm test
