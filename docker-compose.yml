services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: musafir_pos
      POSTGRES_USER: musafir
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "5432:5432"
    volumes:
      - musafir-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musafir -d musafir_pos"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  musafir-postgres:
