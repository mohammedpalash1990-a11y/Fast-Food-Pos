services:
  - type: web
    name: musafir-fast-food-api
    runtime: node
    plan: free
    region: frankfurt
    branch: build/premium-pos-phase-1
    buildCommand: npm install && npm run build
    startCommand: npm run api:start
    healthCheckPath: /api/health
    envVars:
      - key: NEON_DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://musafir-fast-food-pos.onrender.com
      - key: PUBLIC_MENU_BASE_URL
        value: https://musafir-fast-food-pos.onrender.com/menu.html
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_RESTAURANT_NAME
        value: Musafir Fast Food
      - key: BOOTSTRAP_BRANCH_NAME
        value: Main Branch
    initialDeployHook: npm run db:migrate && npm run db:seed
